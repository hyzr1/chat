name: Hyzr terminal launcher

on:
  workflow_dispatch:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - working-directory: agent
        run: npm ci
      - working-directory: agent
        run: npm test
      - run: node scripts/build-agent-cli.mjs
      - name: Show download sizes
        run: ls -lh public/downloads/hyzr public/downloads/hyzr.cmd public/downloads/hyzr-agent.mjs
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/agent-v')
        with:
          files: |
            public/downloads/hyzr
            public/downloads/hyzr.cmd
            public/downloads/hyzr-agent.mjs
          generate_release_notes: true
